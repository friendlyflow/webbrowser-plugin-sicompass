# Its own workspace root: a plugin, only ever built for wasm32-wasip2 (and
# natively for its unit tests).
[workspace]

[package]
name = "webbrowser-plugin"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A web browser for sicompass: pages as lists, rendered by Chrome, as a WASM plugin"
repository = "https://github.com/friendlyflow/webbrowser_plugin_sicompass"
# A plugin ships as a signed release the sicompass Store installs, never on crates.io.
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The guest kit and the FFON model (with the HTML walker the pages go
# through). By git until sicompass-sdk 0.9 and sicompass-pdk 0.6 are on
# crates.io; the pdk uses the SDK from the same rev.
# The guest kit and the FFON model, from crates.io.
sicompass-pdk = "0.6.0"
sicompass-sdk = { version = "0.9.0", default-features = false }
serde = { version = "1", features = ["derive"] }
# The DevTools protocol is JSON.
serde_json = "1"
# Reading `<link rel="alternate" hreflang>` out of `<head>`, which the SDK
# walker skips whole. Same version the SDK already pulls in.
scraper = "0.27"

# Natively, for the live tests, Chrome's pipes on file descriptors 3 and 4.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
# Guests ship as bytecode, and App Store builds interpret rather than JIT them, so
# a small module matters more than aggressive inlining.
opt-level = "s"
lto = true
strip = true

# Working on the SDK and this plugin together: uncomment, and comment it out
# again before committing. With it live, a green build proves nothing about what
# the published crates resolve to.
#
# [patch.crates-io]
# sicompass-pdk = { path = "../sicompass-plugin-sdk/sicompass-pdk" }
# sicompass-sdk = { path = "../sicompass-plugin-sdk" }
