# Its own workspace root: a plugin, a program of its own that sicompass starts.
[workspace]

[package]
name = "webbrowser-plugin"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A web browser for sicompass: pages as lists, rendered by Chrome, as a plugin"
repository = "https://github.com/friendlyflow/webbrowser-plugin-sicompass"
# A plugin ships as a signed release the sicompass Store installs, never on crates.io.
publish = false

# The program sicompass starts (src/main.rs). The browser is the library,
# which the unit tests use.
[[bin]]
name = "webbrowser-plugin"
path = "src/main.rs"

[dependencies]
# The plugin kit (`plugin`) and the FFON model (with the HTML walker the pages
# go through), from crates.io.
sicompass-sdk = { version = "0.9.1", default-features = false, features = ["plugin"] }
serde = { version = "1", features = ["derive"] }
# The DevTools protocol is JSON.
serde_json = "1"
# Reading `<link rel="alternate" hreflang>` out of `<head>`, which the SDK
# walker skips whole. Same version the SDK already pulls in.
scraper = "0.27"
# The DevTools protocol over a websocket on 127.0.0.1, where Chrome has no
# pipe to speak it on (Windows). Plain `ws://`, so no TLS.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

# Chrome's pipes on file descriptors 3 and 4, and stopping Chrome gently.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
# One small executable per platform, downloaded by the Store.
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Working on the SDK and this plugin together: uncomment, and comment it out
# again before committing. With it live, a green build proves nothing about what
# the published crates resolve to.
#
# TEMPORARY, until sicompass-sdk 0.9.1 is on crates.io: the SDK commit with the
# plugin kit (`plugin` feature), by git rev. Remove this section at the release.
[patch.crates-io]
sicompass-sdk = { git = "https://github.com/friendlyflow/sicompass-plugin-sdk", rev = "06a9037b5a1194be87af786bdfde928be173473e" }
